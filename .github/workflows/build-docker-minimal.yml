name: Build Docker Image (Minimal)

# ============================================
# 最小化 Docker 镜像构建工作流
# ============================================
# 用途: 二开场景，构建并推送公开镜像到 GHCR
# 触发:
#   - 推送 tag mygpt-v*  → 自动构建并打 tag + latest
#   - 手动触发            → 输入版本号构建
#
# 镜像地址: ghcr.io/${owner}/mygpt:<version>
# 首次推送后到 GitHub Packages 页面将 Visibility 改为 Public，
# 之后服务器无需 docker login 即可直接 pull。
# ============================================

on:
  push:
    tags:
      - 'mygpt-v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build (e.g., 1.0.0)'
        required: true
        type: string

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mygpt

jobs:
  build:
    name: Build & Push (linux/amd64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: ver
        run: |
          if [ "${{ github.event_name }}" == "workflow_dispatch" ]; then
            v="${{ inputs.version }}"
          else
            v="${{ github.ref_name }}"
          fi
          v="${v#mygpt-v}"
          v="${v#v}"
          echo "version=${v}" >> $GITHUB_OUTPUT

      - name: Get short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}
            ${{ env.IMAGE }}:latest
          build-args: |
            SHA=${{ steps.sha.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Print pull instructions
        run: |
          echo "::notice::Image pushed: ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}"
          echo "::notice::Pull: docker pull ${{ env.IMAGE }}:${{ steps.ver.outputs.version }}"
